<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" class="g-boss b-idle" role="img" aria-labelledby="boss4-title" style="--speed:2.91s;--wave-angle:-20deg;--hop:-10px"><title id="boss4-title">Cổ Chung Thiềm · idle</title><style>.boss-rig{transform-origin:160px 180px;animation:boss-breathe var(--speed) ease-in-out infinite}.boss-left,.boss-right{transform-box:fill-box;transform-origin:50% 10%}.boss-tail{transform-origin:210px 210px;animation:boss-tail 3s ease-in-out infinite}.boss-wing{transform-origin:160px 150px;animation:boss-wing 2s ease-in-out infinite}.boss-eyes{animation:boss-blink 5s infinite;transform-origin:160px 130px}.boss-aura{transform-origin:160px 160px;animation:boss-orbit 20s linear infinite}.boss-particles{animation:boss-glow 2s ease-in-out infinite}.b-appear .boss-rig{animation:boss-arrive .8s both}.b-challenge .boss-right{animation:boss-wave calc(var(--speed)*.6) infinite}.b-progress .boss-left{animation:boss-wave calc(var(--speed)*.8) infinite}.b-encourage .boss-right,.b-celebrate .boss-right{animation:boss-wave calc(var(--speed)*.3) infinite}.b-timeout .boss-rig{animation:boss-sigh 4s infinite}.b-timeout .boss-aura{opacity:.15}.b-celebrate .boss-rig{animation:boss-hop calc(var(--speed)*.4) infinite}.b-ascend .boss-rig{animation:boss-rise calc(var(--speed)*1.2) infinite}.b-ascend .boss-aura{animation:boss-orbit 5s linear infinite}.boss-caption{font:13px system-ui;fill:#29473d;text-anchor:middle}@keyframes boss-breathe{50%{transform:translateY(-5px) scale(1.015)}}@keyframes boss-tail{50%{transform:rotate(12deg)}}@keyframes boss-wing{50%{transform:scaleX(.9) rotate(-4deg)}}@keyframes boss-blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.08)}}@keyframes boss-orbit{to{transform:rotate(360deg)}}@keyframes boss-glow{50%{opacity:.25}}@keyframes boss-arrive{from{opacity:0;transform:translateY(25px) scale(.7)}to{opacity:1;transform:none}}@keyframes boss-wave{50%{transform:rotate(var(--wave-angle))}}@keyframes boss-sigh{50%{transform:translateY(4px) rotate(-3deg)}}@keyframes boss-hop{50%{transform:translateY(var(--hop))}}@keyframes boss-rise{50%{transform:translateY(-15px)}}@media(prefers-reduced-motion:reduce){.g-boss *{animation:none!important}}.g-boss.b-still *{animation:none!important}</style><ellipse cx="160" cy="272" rx="87" ry="12" fill="#89ad63" opacity=".15"/><g class="boss-aura" stroke="#ab914f" fill="none" opacity=".45"><circle cx="160" cy="160" r="122" stroke-width="2" stroke-dasharray="11 14"/><circle cx="273" cy="160" r="4" fill="#ab914f"/><circle cx="216.5" cy="257.8608706276416" r="4" fill="#ab914f"/><circle cx="103.50000000000003" cy="257.8608706276416" r="4" fill="#ab914f"/><circle cx="47" cy="160" r="4" fill="#ab914f"/><circle cx="103.49999999999994" cy="62.139129372358454" r="4" fill="#ab914f"/><circle cx="216.5" cy="62.13912937235844" r="4" fill="#ab914f"/></g><g class="boss-rig"><g stroke="#354b43" stroke-width="5" fill="none"><path d="M108 185 74 166 60 181m49 20-40 4-13 16m153-36 34-19 14 15m-49 20 40 4 13 16M140 81l-11-33m51 33 11-33"/></g><g fill="#354b43"><ellipse cx="134" cy="254" rx="24" ry="10"/><ellipse cx="186" cy="254" rx="24" ry="10"/></g><path d="M112 161Q160 145 208 161L226 242Q160 272 94 242Z" fill="#486949" stroke="#354b43" stroke-width="3"/><path d="m130 164 30 67 30-67m-30 67v27" fill="none" stroke="#ab914f" stroke-width="7"/><path d="M112 214q48 12 96 0" fill="none" stroke="#89ad63" stroke-width="11"/><g class="boss-left"><ellipse cx="102" cy="191" rx="17" ry="29" fill="#486949" stroke="#354b43" stroke-width="3"/><circle cx="99" cy="215" r="13" fill="#d1dfb2" stroke="#354b43" stroke-width="3"/></g><g class="boss-right"><ellipse cx="218" cy="191" rx="17" ry="29" fill="#486949" stroke="#354b43" stroke-width="3"/><circle cx="220" cy="215" r="13" fill="#d1dfb2" stroke="#354b43" stroke-width="3"/><path d="M222 147q20-9 40 0v43q-20-9-40 0Z" fill="#faf0ce" stroke="#ab914f" stroke-width="4"/><path d="M230 157h22m-22 10h18" stroke="#354b43" stroke-width="2"/></g><g fill="#d1dfb2" stroke="#354b43" stroke-width="3" stroke-linejoin="round"><ellipse cx="160" cy="123" rx="63" ry="54"/></g><g class="boss-eyes" fill="#354b43"><ellipse cx="137" cy="126" rx="7" ry="10"/><ellipse cx="183" cy="126" rx="7" ry="10"/><circle cx="139" cy="122" r="2" fill="white"/><circle cx="185" cy="122" r="2" fill="white"/></g><ellipse cx="120" cy="143" rx="10" ry="5" fill="#edb6ab" opacity=".6"/><ellipse cx="200" cy="143" rx="10" ry="5" fill="#edb6ab" opacity=".6"/><path d="M150 148q10 9 20 0" stroke="#354b43" stroke-width="3" fill="none"/><path d="M110 96q50-21 100 0l-12-22-18 8-20-25-20 25-18-8Z" fill="#486949" stroke="#ab914f" stroke-width="3"/><circle cx="160" cy="88" r="7" fill="#89ad63" stroke="#ab914f" stroke-width="2"/><path d="M113 106l7 5-5 4" stroke="#89ad63" stroke-width="3" fill="none"/><path d="M128 119l7 5-5 4" stroke="#89ad63" stroke-width="3" fill="none"/><path d="M143 114l7 5-5 4" stroke="#89ad63" stroke-width="3" fill="none"/><path d="M158 109l7 5-5 4" stroke="#89ad63" stroke-width="3" fill="none"/><g class="boss-particles" fill="#ab914f"><circle cx="92" cy="73" r="2"/><circle cx="139" cy="104" r="3"/><circle cx="186" cy="135" r="4"/><circle cx="233" cy="166" r="2"/><circle cx="280" cy="197" r="3"/><circle cx="82" cy="228" r="4"/></g></g><text class="boss-caption" x="160" y="309">Cổ Chung Thiềm</text></svg>