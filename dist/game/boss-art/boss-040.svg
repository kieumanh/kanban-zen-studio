<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" class="g-boss b-idle" role="img" aria-labelledby="boss40-title" style="--speed:2.4s;--wave-angle:-31deg;--hop:-7px"><title id="boss40-title">Minh Nguyệt Cung Chủ · idle</title><style>.boss-rig{transform-origin:160px 180px;animation:boss-breathe var(--speed) ease-in-out infinite}.boss-left,.boss-right{transform-box:fill-box;transform-origin:50% 10%}.boss-tail{transform-origin:210px 210px;animation:boss-tail 3s ease-in-out infinite}.boss-wing{transform-origin:160px 150px;animation:boss-wing 2s ease-in-out infinite}.boss-eyes{animation:boss-blink 5s infinite;transform-origin:160px 130px}.boss-aura{transform-origin:160px 160px;animation:boss-orbit 20s linear infinite}.boss-particles{animation:boss-glow 2s ease-in-out infinite}.b-appear .boss-rig{animation:boss-arrive .8s both}.b-challenge .boss-right{animation:boss-wave calc(var(--speed)*.6) infinite}.b-progress .boss-left{animation:boss-wave calc(var(--speed)*.8) infinite}.b-encourage .boss-right,.b-celebrate .boss-right{animation:boss-wave calc(var(--speed)*.3) infinite}.b-timeout .boss-rig{animation:boss-sigh 4s infinite}.b-timeout .boss-aura{opacity:.15}.b-celebrate .boss-rig{animation:boss-hop calc(var(--speed)*.4) infinite}.b-ascend .boss-rig{animation:boss-rise calc(var(--speed)*1.2) infinite}.b-ascend .boss-aura{animation:boss-orbit 5s linear infinite}.boss-caption{font:13px system-ui;fill:#29473d;text-anchor:middle}@keyframes boss-breathe{50%{transform:translateY(-5px) scale(1.015)}}@keyframes boss-tail{50%{transform:rotate(12deg)}}@keyframes boss-wing{50%{transform:scaleX(.9) rotate(-4deg)}}@keyframes boss-blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.08)}}@keyframes boss-orbit{to{transform:rotate(360deg)}}@keyframes boss-glow{50%{opacity:.25}}@keyframes boss-arrive{from{opacity:0;transform:translateY(25px) scale(.7)}to{opacity:1;transform:none}}@keyframes boss-wave{50%{transform:rotate(var(--wave-angle))}}@keyframes boss-sigh{50%{transform:translateY(4px) rotate(-3deg)}}@keyframes boss-hop{50%{transform:translateY(var(--hop))}}@keyframes boss-rise{50%{transform:translateY(-15px)}}@media(prefers-reduced-motion:reduce){.g-boss *{animation:none!important}}.g-boss.b-still *{animation:none!important}</style><ellipse cx="160" cy="272" rx="87" ry="12" fill="#b29bc6" opacity=".15"/><g class="boss-aura" stroke="#ab914f" fill="none" opacity=".45"><circle cx="160" cy="160" r="122" stroke-width="2" stroke-dasharray="13 14"/><circle cx="273" cy="160" r="4" fill="#ab914f"/><circle cx="251.41892036436906" cy="226.41973350904948" r="4" fill="#ab914f"/><circle cx="194.91892036436906" cy="267.46938634135233" r="4" fill="#ab914f"/><circle cx="125.08107963563094" cy="267.46938634135233" r="4" fill="#ab914f"/><circle cx="68.58107963563096" cy="226.41973350904948" r="4" fill="#ab914f"/><circle cx="47" cy="160" r="4" fill="#ab914f"/><circle cx="68.58107963563094" cy="93.58026649095055" r="4" fill="#ab914f"/><circle cx="125.08107963563093" cy="52.53061365864765" r="4" fill="#ab914f"/><circle cx="194.91892036436903" cy="52.53061365864764" r="4" fill="#ab914f"/><circle cx="251.41892036436906" cy="93.5802664909505" r="4" fill="#ab914f"/></g><g class="boss-rig"><path class="boss-tail" d="M210 215Q289 223 255 170Q246 157 245 183Q247 205 211 198" fill="#e2dbec" stroke="#354b43" stroke-width="4"/><g fill="#354b43"><ellipse cx="134" cy="254" rx="24" ry="10"/><ellipse cx="186" cy="254" rx="24" ry="10"/></g><path d="M112 161Q160 145 208 161L226 242Q160 272 94 242Z" fill="#655777" stroke="#354b43" stroke-width="3"/><path d="m130 164 30 67 30-67m-30 67v27" fill="none" stroke="#ab914f" stroke-width="7"/><path d="M112 214q48 12 96 0" fill="none" stroke="#b29bc6" stroke-width="11"/><g class="boss-left"><ellipse cx="102" cy="191" rx="17" ry="29" fill="#655777" stroke="#354b43" stroke-width="3"/><circle cx="99" cy="215" r="13" fill="#e2dbec" stroke="#354b43" stroke-width="3"/></g><g class="boss-right"><ellipse cx="218" cy="191" rx=