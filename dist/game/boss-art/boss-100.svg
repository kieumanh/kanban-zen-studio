<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" class="g-boss b-idle" role="img" aria-labelledby="boss100-title" style="--speed:3.76s;--wave-angle:-16deg;--hop:-15px"><title id="boss100-title">Quy Nguyên Chân Long · idle</title><style>.boss-rig{transform-origin:160px 180px;animation:boss-breathe var(--speed) ease-in-out infinite}.boss-left,.boss-right{transform-box:fill-box;transform-origin:50% 10%}.boss-tail{transform-origin:210px 210px;animation:boss-tail 3s ease-in-out infinite}.boss-wing{transform-origin:160px 150px;animation:boss-wing 2s ease-in-out infinite}.boss-eyes{animation:boss-blink 5s infinite;transform-origin:160px 130px}.boss-aura{transform-origin:160px 160px;animation:boss-orbit 20s linear infinite}.boss-particles{animation:boss-glow 2s ease-in-out infinite}.b-appear .boss-rig{animation:boss-arrive .8s both}.b-challenge .boss-right{animation:boss-wave calc(var(--speed)*.6) infinite}.b-progress .boss-left{animation:boss-wave calc(var(--speed)*.8) infinite}.b-encourage .boss-right,.b-celebrate .boss-right{animation:boss-wave calc(var(--speed)*.3) infinite}.b-timeout .boss-rig{animation:boss-sigh 4s infinite}.b-timeout .boss-aura{opacity:.15}.b-celebrate .boss-rig{animation:boss-hop calc(var(--speed)*.4) infinite}.b-ascend .boss-rig{animation:boss-rise calc(var(--speed)*1.2) infinite}.b-ascend .boss-aura{animation:boss-orbit 5s linear infinite}.boss-caption{font:13px system-ui;fill:#29473d;text-anchor:middle}@keyframes boss-breathe{50%{transform:translateY(-5px) scale(1.015)}}@keyframes boss-tail{50%{transform:rotate(12deg)}}@keyframes boss-wing{50%{transform:scaleX(.9) rotate(-4deg)}}@keyframes boss-blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.08)}}@keyframes boss-orbit{to{transform:rotate(360deg)}}@keyframes boss-glow{50%{opacity:.25}}@keyframes boss-arrive{from{opacity:0;transform:translateY(25px) scale(.7)}to{opacity:1;transform:none}}@keyframes boss-wave{50%{transform:rotate(var(--wave-angle))}}@keyframes boss-sigh{