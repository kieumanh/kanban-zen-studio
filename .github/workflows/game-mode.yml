name: Verify experimental Game Mode
on:
  push:
    branches: [experiment/game-mode]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint && npm run format:check
      - run: npm run build && npm test && node tests/game-mode.mjs
      - run: npm install --no-save --package-lock=false playwright && npx playwright install --with-deps chromium
      - run: node tests/game-mode-browser.mjs && node tests/game-two-device.mjs && node tests/boss-art-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-mode-verification
          path: qa/
