name: Verify Zen AI Personal Free
on:
  push:
    branches: [feature/zen-ai-secretary-personal-free]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Worker
        run: npm run build
      - name: Run existing and Zen AI tests
        run: npm test
      - name: Check for prohibited paid inference integrations
        run: |
          ! grep -E 'api\.openai\.com|api\.anthropic\.com|api\.elevenlabs\.io' server/zen-ai.mjs
