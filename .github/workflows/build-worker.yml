name: Verify and deploy Kanban Production
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'server/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/build-worker.yml'
  workflow_dispatch:
concurrency:
  group: kanban-production
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install development tools
        run: npm ci
      - name: Lint and check formatting
        run: npm run lint && npm run format:check
      - name: Build Worker
        run: node scripts/build.mjs
      - name: Run tests
        run: npm test
      # v1.74.0: bước này từng đỏ 3 lần liên tiếp chỉ vì máy chủ GitHub không phân giải được tên miền kho apt
      # ("Temporary failure resolving azure.archive.ubuntu.com"), trước khi bất kỳ test hay bước triển khai nào chạy.
      # Chỉ thêm thử lại có giới hạn quanh phần CÀI ĐẶT; không đổi test nào, không bỏ qua test nào.
      # Lỗi thật ở bước kiểm tra phía sau vẫn làm đỏ như cũ; hết 4 lần thử vẫn lỗi thì bước này vẫn đỏ.
      - name: Install Playwright package
        run: |
          for attempt in 1 2 3 4; do
            npm install --no-save --package-lock=false playwright && exit 0
            echo "npm install attempt $attempt failed" >&2
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 15))
          done
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install responsive browser check
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          for attempt in 1 2 3 4; do
            npx playwright install --with-deps chromium && exit 0
            echo "playwright install attempt $attempt failed" >&2
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 20))
          done
      - name: Verify established workflows on mobile tablet desktop
        run: |
          node tests/workflow111-browser.mjs
          node tests/report-layout-browser.mjs
          node tests/offline-browser.mjs
          node tests/tablet-layout-browser.mjs
          node tests/nav-frame-browser.mjs
          node tests/kanban-card-browser.mjs
          node tests/project-header-browser.mjs
          node tests/display-menu-browser.mjs
          node tests/compact-default-browser.mjs
          node tests/language-browser.mjs
          node tests/a11y-contrast-browser.mjs
          node tests/a11y-interaction-browser.mjs
          node tests/task-list-browser.mjs
          node tests/notice-browser.mjs
          node tests/save-state-browser.mjs
          node tests/compact-checks-browser.mjs
          node tests/sync-alerts-browser.mjs
          node tests/a11y-dialogs-browser.mjs
          node tests/gantt-touch-browser.mjs
          node tests/calendar-agenda-browser.mjs
          node tests/motif-removed-browser.mjs
          node tests/pin-panel-browser.mjs
          node tests/done-card-browser.mjs
          node tests/delete-zone-browser.mjs
          node tests/theme-browser.mjs
          node tests/theme-contrast-browser.mjs
          node tests/startup-ready-browser.mjs
