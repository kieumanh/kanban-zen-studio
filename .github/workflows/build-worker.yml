name: Verify and deploy Kanban Production
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'server/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/build-worker.yml'
  workflow_dispatch:
concurrency:
  group: kanban-production
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install development tools
        run: npm ci
      - name: Lint and check formatting
        run: npm run lint && npm run format:check
      - name: Build Worker
        run: node scripts/build.mjs
      - name: Run tests
        run: npm test
      # v2.43.0: bản dựng đã qua lint và npm test được giữ lại; job deploy đẩy đúng các tệp này lên Cloudflare.
      - name: Keep the verified build for deployment
        uses: actions/upload-artifact@v4
        with:
          name: verified-build-${{ github.run_id }}
          path: |
            worker-api.mjs
            public/
          retention-days: 7
  # v2.43.0: bài kiểm thử trình duyệt chạy song song theo nhóm (danh sách ở tests/browser-tests.txt, chia nhóm ở scripts/run-browser-tests.mjs).
  # Cổng triển khai không đổi: job deploy chỉ chạy khi job build và mọi nhóm browser đều xanh.
  browser:
    name: Browser tests ${{ matrix.group }}/5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install development tools
        run: npm ci
      - name: Build Worker
        run: node scripts/build.mjs
      # v1.74.0: bước này từng đỏ 3 lần liên tiếp chỉ vì máy chủ GitHub không phân giải được tên miền kho apt
      # ("Temporary failure resolving azure.archive.ubuntu.com"), trước khi bất kỳ test hay bước triển khai nào chạy.
      # Chỉ thêm thử lại có giới hạn quanh phần CÀI ĐẶT; không đổi test nào, không bỏ qua test nào.
      # Lỗi thật ở bước kiểm tra phía sau vẫn làm đỏ như cũ; hết 4 lần thử vẫn lỗi thì bước này vẫn đỏ.
      - name: Install Playwright package
        run: |
          for attempt in 1 2 3 4; do
            npm install --no-save --package-lock=false playwright && exit 0
            echo "npm install attempt $attempt failed" >&2
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 15))
          done
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install responsive browser check
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          for attempt in 1 2 3 4; do
            npx playwright install --with-deps chromium && exit 0
            echo "playwright install attempt $attempt failed" >&2
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 20))
          done
      - name: Verify established workflows on mobile tablet desktop
        run: node scripts/run-browser-tests.mjs --group ${{ matrix.group }} --of 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-regression-${{ github.run_id }}-${{ matrix.group }}
          path: qa/
          retention-days: 7
          if-no-files-found: ignore
  deploy:
    name: Deploy to Cloudflare
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download the verified build
        uses: actions/download-artifact@v4
        with:
          name: verified-build-${{ github.run_id }}
          path: .
      - name: Check the verified build is complete
        run: test -f worker-api.mjs && test -d public
      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN in repository Settings > Secrets and variables > Actions. It must allow deployment to kanban-zen-studio."
            exit 1
          fi
      - name: Record recovery point
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 53ab746eeba03687cf19d683fab74b36
        run: |
          mkdir -p deployment-recovery
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/kanban-zen-studio/deployments" \
            -o deployment-recovery/deployments.json
          node -e "const r=require('./deployment-recovery/deployments.json');if(!r.success||!r.result.deployments.length)process.exit(1)"
          git rev-parse HEAD > deployment-recovery/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: production-recovery-${{ github.run_id }}
          path: deployment-recovery/
          retention-days: 30
      - name: Apply or verify versioned D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 53ab746eeba03687cf19d683fab74b36
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx --yes wrangler@4 d1 migrations apply kanban-zen-studio --remote
          else
            node scripts/verify-migration-receipt.mjs
          fi
      - name: Deploy verified Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 53ab746eeba03687cf19d683fab74b36
        run: npx --yes wrangler@4 deploy --keep-vars --message "GitHub Actions ${{ github.sha }}"
      - name: Verify active deployment and production health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 53ab746eeba03687cf19d683fab74b36
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-production.mjs
