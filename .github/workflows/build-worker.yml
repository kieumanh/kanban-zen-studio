          node tests/project-tab-compact-browser.mjs
          node tests/growth-browser.mjs
          node tests/growth-report-browser.mjs
          node tests/growth-notify-browser.mjs
          node tests/growth-spend-browser.mjs
          node tests/growth-wuxia-browser.mjs
          node tests/growth-levels-browser.mjs
          node tests/growth-story-browser.mjs
          node tests/growth-tale-browser.mjs
          node tests/growth-meet-browser.mjs
          node tests/growth-foes-browser.mjs
