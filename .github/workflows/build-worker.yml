name: Verify and bundle Kanban Worker
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'server/**'
      - 'scripts/build.mjs'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/build-worker.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Worker
        run: node scripts/build.mjs
      - name: Run tests
        run: npm test
      - name: Install responsive browser check
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify established workflows on mobile tablet desktop
        run: node tests/workflow111-browser.mjs
      - name: Sync generated Worker
        run: |
          if ! git diff --quiet -- worker.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add worker.mjs
            git commit -m "build: sync Worker after source update [skip ci]"
            git push
          fi
