name: Verify and deploy Kanban Production
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'server/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/build-worker.yml'
  workflow_dispatch:
concurrency:
  group: kanban-production
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install development tools
        run: npm ci
      - name: Lint and check formatting
        run: npm run lint && npm run format:check
      - name: Build Worker
        run: node scripts/build.mjs
      - name: Run tests
        run: npm test
      - name: Install responsive browser check
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify established workflows on mobile tablet desktop
        run: |
          node tests/workflow111-browser.mjs
          node tests/report-layout-browser.mjs
          node tests/offline-browser.mjs
          node tests/tablet-layout-browser.mjs
          node tests/nav-frame-browser.mjs
          node tests/kanban-card-browser.mjs
          node tests/project-header-browser.mjs
          node tests/display-menu-browser.mjs
          node tests/compact-default-browser.mjs
          node tests/language-browser.mjs
          node tests/a11y-contrast-browser.mjs
          node tests/a11y-interaction-browser.mjs
          node tests/task-list-browser.mjs
          node tests/notice-browser.mjs
          node tests/save-state-browser.mjs
          node tests/compact-checks-browser.mjs
          node tests/sync-alerts-browser.mjs
          node tests/a11y-dialogs-browser.mjs
          node tests/gantt-touch-browser.mjs
          node tests/calendar-agenda-browser.mjs
          node tests/motif-removed-browser.mjs
          node tests/pin-panel-browser.mjs
          node tests/done-card-browser.mjs
          node tests/delete-zone-browser.mjs
          node tests/theme-browser.mjs
          node tests/theme-contrast-browser.mjs
          node tests/startup-ready-browser.mjs
          node tests/theme-gantt-browser.mjs
          node tests/project-delete-target-browser.mjs
          node tests/trash-clear-browser.mjs
          node tests/welcome-slots-browser.mjs
          node tests/timeline-removed-browser.mjs
          node tests/theme-toggle-browser.mjs
          node tests/notifications-ui-browser.mjs
          node tests/quick-notes-browser.mjs
          node tests/task-chips-browser.mjs
          node tests/checklist-browser.mjs
          node tests/focus-button-browser.mjs
          node tests/focus-hover-browser.mjs
          node tests/focus-edit-browser.mjs
          node tests/close-animation-browser.mjs
          node tests/note-art-soft-browser.mjs
          node tests/settings-collapse-browser.mjs
          node tests/checklist-progress-browser.mjs
          node tests/welcome-flow-browser.mjs
          node tests/welcome-long-quote-browser.mjs
          node tests/pin-tasks-browser.mjs
          node tests/checklist-tight-browser.mjs
          node tests/release-notice-buttons-browser.mjs
          node tests/gantt-hide-done-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-regression-${{ github.run_id }}
          path: qa/
          retention-days: 7
      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN in repository Settings > Secrets and variables > Actions. It must allow deployment to kanban-zen-studio."
            exit 1
          fi
      - name: Record recovery point
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 53ab746eeba03687cf19d683fab74b36
        run: |
          mkdir -p deployment-recovery
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/kanban-zen-studio/deployments" \
            -o deployment-recovery/deployments.json
          node -e "const r=require('./deployment-recovery/deployments.json');if(!r.success||!r.result.deployments.length)process.exit(1)"
          git rev-parse HEAD > deployment-recovery/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: production-recovery-${{ github.run_id }}
          path: deployment-recovery/
          retention-days: 30
      - name: Apply or verify versioned D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 53ab746eeba03687cf19d683fab74b36
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx --yes wrangler@4 d1 migrations apply kanban-zen-studio --remote
          else
            node scripts/verify-migration-receipt.mjs
          fi
      - name: Deploy verified Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 53ab746eeba03687cf19d683fab74b36
        run: npx --yes wrangler@4 deploy --keep-vars --message "GitHub Actions ${{ github.sha }}"
      - name: Verify active deployment and production health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 53ab746eeba03687cf19d683fab74b36
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-production.mjs
