          node tests/notifications-ui-browser.mjs
          node tests/quick-notes-browser.mjs
          node tests/checklist-browser.mjs
          node tests/focus-button-browser.mjs
          node tests/focus-hover-browser.mjs
          node tests/focus-edit-browser.mjs
          node tests/close-animation-browser.mjs
          node tests/note-art-soft-browser.mjs
          node tests/settings-collapse-browser.mjs
          node tests/checklist-progress-browser.mjs
          node tests/welcome-flow-browser.mjs
          node tests/welcome-long-quote-browser.mjs
          node tests/pin-tasks-browser.mjs
          node tests/checklist-tight-browser.mjs
          node tests/checklist-number-browser.mjs
          node tests/habit-remind-picker-browser.mjs
          node tests/rich-text-escape-browser.mjs
          node tests/completion-milestone-browser.mjs
