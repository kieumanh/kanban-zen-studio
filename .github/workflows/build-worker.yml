          node tests/device-audit-browser.mjs
          node tests/gantt-edge-route-browser.mjs
          node tests/note-paste-lines-browser.mjs
          node tests/topbar-center-browser.mjs
          node tests/habit-today-frame-browser.mjs
          node tests/top-tools-compact-browser.mjs
          node tests/habit-today-align-browser.mjs
          node tests/task-editor-compact-browser.mjs
          node tests/budget-browser.mjs
          node tests/budget-dashboard-browser.mjs
          node tests/budget-breakeven-browser.mjs
          node tests/finance-report-browser.mjs
          node tests/finance-share-browser.mjs
          node tests/perf-dates-browser.mjs
          node tests/dashboard-context-browser.mjs
          node tests/diagnostics-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-regression-${{ github.run_id }}
          path: qa/
          retention-days: 7
      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN in repository Settings > Secrets and variables > Actions. It must allow deployment to kanban-zen-studio."
            exit 1
          fi
      - name: Record recovery point
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 53ab746eeba03687cf19d683fab74b36
        run: |
          mkdir -p deployment-recovery
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/kanban-zen-studio/deployments" \
            -o deployment-recovery/deployments.json
          node -e "const r=require('./deployment-recovery/deployments.json');if(!r.success||!r.result.deployments.length)process.exit(1)"
          git rev-parse HEAD > deployment-recovery/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: production-recovery-${{ github.run_id }}
          path: deployment-recovery/
          retention-days: 30
      - name: Apply or verify versioned D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 53ab746eeba03687cf19d683fab74b36
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx --yes wrangler@4 d1 migrations apply kanban-zen-studio --remote
          else
            node scripts/verify-migration-receipt.mjs
          fi
      - name: Deploy verified Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 53ab746eeba03687cf19d683fab74b36
        run: npx --yes wrangler@4 deploy --keep-vars --message "GitHub Actions ${{ github.sha }}"
      - name: Verify active deployment and production health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 53ab746eeba03687cf19d683fab74b36
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-production.mjs
