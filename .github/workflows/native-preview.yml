name: Native preview builds
on:
  workflow_dispatch:
  push:
    branches: [offline-first-native-preview]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run build && npm test && npm run test:offline
      - run: npx playwright install --with-deps chromium
      - run: npm run test:offline:browser
  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run build:windows -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test install and uninstall in a Unicode path
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Kanban-Thử-nghiệm'
          $setup = Get-ChildItem release/windows/*Setup.exe | Select-Object -First 1
          $installed = Start-Process -FilePath $setup.FullName -ArgumentList '/S',"/D=$target" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw 'Installer failed' }
          if (!(Test-Path (Join-Path $target 'Kanban Zen Studio.exe'))) { throw 'Application executable missing' }
          $sentinel = Join-Path $target 'user-file-to-preserve.txt'
          Set-Content -Path $sentinel -Value 'User-owned files must survive uninstall'
          $removed = Start-Process -FilePath (Join-Path $target 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw 'Uninstaller failed' }
          if (!(Test-Path $sentinel)) { throw 'Uninstaller removed a user-owned file' }
          Remove-Item -Recurse -Force $target
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: |
            release/windows/*Setup.exe
            release/windows/*.blockmap
            release/windows/latest*.yml
  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - run: npm ci && npm run build
      - name: Restore stable signing key
        id: signing
        env:
          KEY_BASE64: ${{ secrets.ZEN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if test -n "$KEY_BASE64"; then
            printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/zen-release.jks"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'No signing secret: compile an unsigned validation artifact only.'
          fi
      - name: Build signed release
        if: steps.signing.outputs.ready == 'true'
        run: gradle --no-daemon -p native/android assembleRelease
        env:
          ZEN_ANDROID_KEYSTORE: ${{ runner.temp }}/zen-release.jks
          ZEN_ANDROID_STORE_PASSWORD: ${{ secrets.ZEN_ANDROID_STORE_PASSWORD }}
          ZEN_ANDROID_KEY_ALIAS: zen-release
          ZEN_ANDROID_KEY_PASSWORD: ${{ secrets.ZEN_ANDROID_KEY_PASSWORD }}
      - name: Validate unsigned release when signing is not configured
        if: steps.signing.outputs.ready != 'true'
        run: gradle --no-daemon -p native/android assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview-${{ steps.signing.outputs.ready == 'true' && 'signed' || 'unsigned' }}
          path: native/android/app/build/outputs/apk/release/*.apk
